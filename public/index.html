<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 80px; }
    form { display: flex; flex-direction: column; gap: 10px; width: 280px; }
    input, button { padding: 10px; font-size: 16px; }
    #msg { color: crimson; }
  </style>
</head>
<body>
  <form id="f">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />
    <button>Sign in</button>
    <p id="msg"></p>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/auth/signin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.value, password: password.value }),
      });
      const data = await res.json();
      if (!res.ok) return (msg.textContent = data.error);
      localStorage.setItem("token", data.token); // store token
      location.href = "/profile.html"; // go to next page
    });
  </script>
</body>
</html>
